<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uno Leaderboard Auto-Rotator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 32px 48px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; font-size: 22px; color: #90caf9; }
    .status {
      font-size: 28px;
      font-weight: bold;
      color: #4caf50;
      margin: 20px 0 10px 0;
    }
    .timer { font-size: 14px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bowling Honor Roll Rotator</h1>
    <div class="status" id="slotDisplay">Starting...</div>
    <div class="timer" id="timerDisplay">Rotating every 60 seconds</div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    // 1. Paste your actual Uno App API URL below:
    const API_URL = "https://app.overlays.uno/apiv2/controlapps/5c0fHEqV4HgMnccvPEqK33/api";
    
    // 2. Your Overlay ID:
    const OVERLAY_ID = "4d686c9b-c0fa-494f-8d02-6be8b16759ee";

    // 3. The 3 Slots in order:
    const SLOTS = [
      { name: "High Games", index: 0 },
      { name: "High Series", index: 1 },
      { name: "Youth High Scores", index: 2 }
    ];

    const INTERVAL_SECONDS = 10; // 1 minute per slide
    // =================================================

    let currentIdx = 0;

    async function showNextSlot() {
      const slot = SLOTS[currentIdx];
      document.getElementById("slotDisplay").innerText = "On-Air: " + slot.name;

      try {
        await fetch(API_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            command: "ShowOverlay",
            id: OVERLAY_ID,
            slot: slot.name,
            slotIndex: slot.index
          })
        });
      } catch (err) {
        console.error("Failed to switch slot:", err);
      }

      // Cycle to the next slot (0 -> 1 -> 2 -> 0)
      currentIdx = (currentIdx + 1) % SLOTS.length;
    }

    // Trigger first slide immediately, then every 60s
    showNextSlot();
    setInterval(showNextSlot, INTERVAL_SECONDS * 1000);
  </script>
</body>
</html>
